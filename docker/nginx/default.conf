# Nginx : sert l'application React (fichiers statiques) et relaie /api vers l'API.
# En production, la terminaison TLS 1.3 (port 443, certificat Let's Encrypt)
# est ajoutée sur le VPS : voir le README.

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Taille maximale d'un relevé importé
        client_max_body_size 2m;
    }

    # Fichiers générés par Vite, dont le nom change à chaque build
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Application monopage : toute autre route renvoie index.html
    location / {
        try_files $uri /index.html;
    }
}
