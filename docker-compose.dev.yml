# Surcharge pour le développement local : expose PostgreSQL sur la machine (localhost uniquement)
# pour que l'API lancée avec `npm run dev:api` puisse s'y connecter.
# Lancement : docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db

services:
  db:
    ports:
      - '127.0.0.1:5432:5432'
