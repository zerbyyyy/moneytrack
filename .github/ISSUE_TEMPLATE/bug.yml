name: Anomalie
description: Signaler un bogue (fiche de consignation, Bloc 4 C4.2.1)
title: '[Bug] '
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur…
        2. Cliquer sur…
        3. Constater…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Résultat obtenu
      description: Message d'erreur, capture d'écran, identifiant d'erreur Sentry
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Gravité
      options:
        - P1 – service indisponible ou fuite de données
        - P2 – fonctionnalité principale inutilisable
        - P3 – fonctionnalité dégradée, contournement possible
        - P4 – gêne mineure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version concernée
      placeholder: v0.1.0
  - type: input
    id: environment
    attributes:
      label: Environnement
      placeholder: Navigateur, système, production ou local
  - type: textarea
    id: analysis
    attributes:
      label: Analyse et correctif proposé
      description: À compléter par l'équipe lors de la qualification
