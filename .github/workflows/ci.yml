name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Installer les dépendances
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Construire le package partagé et générer le client Prisma
        run: |
          npm run build -w @moneytrack/shared
          npm run prisma:generate -w @moneytrack/api

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests de l'API (avec seuil de couverture sur la logique métier)
        run: npm run test:coverage -w @moneytrack/api

      - name: Tests de l'interface
        run: npm run test -w @moneytrack/web

      - name: Build
        run: npm run build

      - name: Audit des dépendances
        run: npm audit --audit-level=high --omit=dev

  docker:
    name: Construction des images Docker
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Image de l'API
        run: docker build -f apps/api/Dockerfile -t moneytrack-api .
      - name: Image web (Nginx)
        run: docker build -f apps/web/Dockerfile -t moneytrack-web .
